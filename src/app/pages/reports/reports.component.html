<div class="page">
  <h1 class="page-title">Reportes ejecutivos</h1>
  <p class="page-subtitle">Exportación formal de indicadores, cuadratura y resumen presupuestario para análisis o envío institucional.</p>
  <mat-card class="table-card">
    <mat-card-content>
      <div class="report-actions">
        <button mat-flat-button color="primary" (click)="downloadExcel()"><mat-icon>table_view</mat-icon>Descargar Excel ejecutivo</button>
        <button mat-stroked-button (click)="downloadPdf()"><mat-icon>picture_as_pdf</mat-icon>Descargar PDF ejecutivo</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
