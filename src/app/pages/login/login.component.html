<div class="login-shell">
  <mat-card class="login-card">
    <mat-card-content>
      <div class="login-brand"><div class="brand-mark">D</div><div><strong>DSSM</strong><span>Control Presupuestario</span></div></div>
      <h1>Ingreso a la plataforma</h1>
      <p>Acceso seguro con perfiles y trazabilidad de acciones.</p>
      @if (loading) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline"><mat-label>Usuario</mat-label><mat-icon matPrefix>person</mat-icon><input matInput formControlName="username"></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Contraseña</mat-label><mat-icon matPrefix>lock</mat-icon><input matInput type="password" formControlName="password"></mat-form-field>
        @if (error) { <div class="login-error">{{ error }}</div> }
        <button mat-flat-button color="primary" type="submit" [disabled]="loading"><mat-icon>login</mat-icon>Ingresar</button>
      </form>
      <small>Usuario inicial: <strong>admin</strong> / contraseña: <strong>admin123</strong></small>
    </mat-card-content>
  </mat-card>
</div>
